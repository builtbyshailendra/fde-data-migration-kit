[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fde-data-migration-kit"
version = "0.1.0"
description = "Profile, map, validate, deduplicate, load and reconcile a customer's legacy CSV and Excel data."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Shailendra Singh", email = "356085194+builtbyshailendra@users.noreply.github.com" }]
keywords = ["data-migration", "etl", "csv", "excel", "sqlalchemy", "pandera", "deduplication"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "pandera>=0.24",
  "rapidfuzz>=3.9",
  "sqlalchemy>=2.0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
migkit = "migkit.cli:main"

[project.urls]
Homepage = "https://github.com/builtbyshailendra/fde-data-migration-kit"
Changelog = "https://github.com/builtbyshailendra/fde-data-migration-kit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/migkit"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["migkit"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "C4", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.isort]
known-first-party = ["migkit"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF012"]
# The sample invoice table reads best one invoice per line.
"scripts/build_sample_workbook.py" = ["E501"]
